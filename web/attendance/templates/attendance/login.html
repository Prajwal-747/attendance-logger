<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AttendanceLogger</title>
</head>
<body>
    <h1>AttendanceLogger</h1>
    <h2>Login</h2>

    {% if form.errors %}
        <p>Invalid email or password. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="id_username">Email</label>
        {{ form.username }}

        <br><br>

        <label for="id_password">Password</label>
        {{ form.password }}

        <br><br>

        <button type="submit">Login</button>
    </form>
</body>
</html>
